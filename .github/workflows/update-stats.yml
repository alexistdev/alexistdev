name: Update GitHub stats

on:
  schedule:
    # Every Monday at 00:00 UTC (07:00 WIB)
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Count stars and forks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          gh api --paginate "users/${OWNER}/repos?per_page=100&type=owner" \
            --jq '.[] | [.stargazers_count, .forks_count] | @tsv' > counts.tsv

          # Never overwrite good numbers with an empty result
          if [ ! -s counts.tsv ]; then
            echo "No repositories returned, keeping previous stats.json"
            exit 1
          fi

          jq -Rn --arg updated "$(date -u +%Y-%m-%d)" '
            [inputs | split("\t") | map(tonumber)]
            | {stars: (map(.[0]) | add), forks: (map(.[1]) | add), updated: $updated}
          ' counts.tsv > stats.json
          rm counts.tsv
          cat stats.json

      - name: Commit stats.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore(stats): update stars and forks"
          git push
